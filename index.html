<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>20/07/2026</title>

<style>

body{
margin:0;
overflow:hidden;
background:black;
font-family:Arial,sans-serif;
}

#bgvideo{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-3;
}

.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.65);
z-index:-2;
}

#metamorfo{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:70%;
max-width:900px;
filter:brightness(0) invert(1) drop-shadow(0 0 25px white);
opacity:0;
pointer-events:none;
z-index:-1;
transition:opacity 2s;
}

#contador{
position:absolute;
top:80px;
left:50%;
transform:translateX(-50%);
color:white;
font-size:60px;
font-family:Impact;
letter-spacing:5px;
text-shadow:0 0 20px white;
}

#papel{
display:none;
position:absolute;
left:50%;
top:-200px;
transform:translateX(-50%);
background:white;
color:black;
padding:25px 60px;
font-size:40px;
font-weight:bold;
cursor:pointer;
z-index:3;
}

.cair{
animation:cairPapel 1.5s forwards;
}

@keyframes cairPapel{
from{
top:-200px;
transform:translateX(-50%) rotate(-10deg);
}
to{
top:300px;
transform:translateX(-50%) rotate(5deg);
}
}

#quebraCabeca{
position:absolute;
bottom:30px;
left:50%;
transform:translateX(-50%);
width:480px;
height:480px;
display:grid;
grid-template-columns:repeat(6,1fr);
grid-template-rows:repeat(6,1fr);
z-index:5;
}

.peca{
border:1px solid rgba(255,255,255,.05);
background-image:url("snuffs_si.png");
background-size:480px 480px;
filter:brightness(0);
cursor:pointer;
transition:.3s;
}

.peca:hover{
filter:brightness(.2);
}

</style>
</head>

<body>

<video autoplay muted loop playsinline id="bgvideo">
<source src="glitch.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<audio id="musica" loop>
<source src="videoplayback.m4a" type="audio/mp4">
</audio>

<img src="metamorfo_design_transparente.png" id="metamorfo">

<div id="contador"></div>

<div id="papel">20/07/2026</div>

<div id="quebraCabeca"></div>

<script>

// restante do javascript aqui

</script>

</body>
</html>
