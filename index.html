<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>ARG 20/07/2026</title>
<style>
  body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
  }
  video#bgvid {
    position: fixed;
    top: 0; left: 0;
    min-width: 100%;
    min-height: 100%;
    object-fit: cover;
    z-index: -2;
  }
  .overlay {
    position: fixed;
    top:0; left:0;
    width:100%; height:100%;
    background: rgba(0,0,0,0.6);
    z-index: -1;
  }
  #countdown {
    position: absolute;
    top: 20px;
    width: 100%;
    text-align: center;
    color: white;
    font-size: 2em;
  }
  #metamorfo {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 220px;
    filter: brightness(0) invert(1); /* sempre branco */
    opacity: 1; /* já começa 100% branco */
  }
</style>
</head>
<body>
<video id="bgvid" autoplay muted loop>
  <source src="glitch.mp4" type="video/mp4">
</video>
<div class="overlay"></div>
<div id="countdown"></div>
<img id="metamorfo" src="metamorfo_design_transparente.png" alt="Metamorfo">
<audio id="bgmusic" src="videoplayback.m4a" loop></audio>
<script>
  // Countdown
  function updateCountdown() {
    const target = new Date("2026-07-20T00:00:00-03:00").getTime();
    const now = new Date().getTime();
    const diff = target - now;
    if (diff <= 0) {
      document.getElementById("countdown").innerText = "00:00:00:00";
      return;
    }
    const days = Math.floor(diff / (1000*60*60*24));
    const hours = Math.floor((diff % (1000*60*60*24))/(1000*60*60));
    const minutes = Math.floor((diff % (1000*60*60))/(1000*60));
    const seconds = Math.floor((diff % (1000*60))/1000);
    document.getElementById("countdown").innerText =
      `${days}d ${hours}h ${minutes}m ${seconds}s`;
  }
  setInterval(updateCountdown,1000);
  updateCountdown();

  // Música após interação
  document.body.addEventListener("click",()=>{
    document.getElementById("bgmusic").play();
  },{once:true});
</script>
</body>
</html>
